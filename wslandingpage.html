<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wirewave Solutions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌀%3C/text%3E%3C/svg%3E">
    <style>

        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }


        body {
            
            background: radial-gradient(circle at center, #071748 0%, #0d1117 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

                
        .brand-name {
            color: #ffffff;
            font-size: 1.5rem; 
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .author-name {
            color: #a3b8cc; 
            font-size: 1.1rem; 
            font-weight: 400;
            letter-spacing: -0.2px;
            margin-bottom: 16px;
        }

        .tagline {
            color: #9aa5b1;
            font-size: 0.9rem; 
            line-height: 1.6;
            margin-bottom: 28px;
            font-weight: 400;
        }


        
        .card {
            background: linear-gradient(135deg, rgba(22, 27, 34, 0.8) 0%, rgba(13, 17, 23, 0.9) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            
            border: 1px solid rgba(88, 166, 255, 0.15);
            padding: 45px 35px;
            
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4),
                        0 20px 50px rgba(0, 0, 0, 0.6),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        
        .contact-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .contact-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background-color: rgba(33, 38, 45, 0.7);
            border: 1px solid rgba(48, 54, 61, 0.8);
            color: #c9d1d9;
            text-decoration: none;
            font-size: 1.2rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .contact-icon:hover {
            border-color: #58a6ff;
            color: #ffffff;
            background-color: #21262d;
            transform: translateY(-3px);
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.2);
        }

        
        .divider {
            height: 1px;
            
            background: linear-gradient(90deg, transparent, rgba(163, 88, 255, 0.25), transparent);
            width: 100%;
            margin-bottom: 28px;
        }

        
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 18px 22px;
            background-color: rgba(21, 26, 33, 0.6);
            border: 1px solid rgba(64, 72, 82, 0.7);
            border-radius: 12px;
            color: #cddee9;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: -0.2px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            border-color: #58a6ff;
            color: #ffffff;
            background-color: rgba(33, 38, 45, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), 
                        0 0 12px rgba(88, 166, 255, 0.1);
        }

        .btn-icon {
            font-size: 1.1rem;
            color: #6e7681;
            transition: transform 0.25s ease, color 0.25s ease;
        }
        
        
        .btn:hover .btn-icon {
            color: #58a6ff;
            transform: translateX(3px);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="brand-name">Wirewave Solutions</h1>
        <h3 class="author-name">Luca Palmer</h3>
        <p class="tagline">Specialised B2B data consulting focused on accelerating cloud data architecture, automation, and enterprise-grade data quality & governance</p>
        
        <div class="contact-row">
            <a href="https://linkedin.com/in/lucapal" target="_blank" class="contact-icon linkedin-icon" title="LinkedIn">in</a>
            <a href="mailto:luca@wirewavesolutions.io" class="contact-icon" title="Send an Email">✉</a>
            <a href="https://calendly.com/lucapal" target="_blank" class="contact-icon" title="Book a Call">📅</a>
        </div>

        <div class="divider"></div>

        <div class="button-stack">

            <a href="https://cutt.ly/mtH5Ntgd" target="_blank" class="btn">
                <span>E-Commerce Analytics Dashboard</span>
                <span class="btn-icon">📊</span>
            </a>

            <a href="https://2o63m7.site/" target="_blank" class="btn">
                <span>Full Stack Streaming Platform</span>
                <span class="btn-icon">💻</span>
            </a>

        </div>
    </div>

</body>
</html>

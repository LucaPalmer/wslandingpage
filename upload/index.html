<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#0a192f">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Address Enrichment Upload</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌀%3C/text%3E%3C/svg%3E">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #0a192f;
        }
        
        body {
            background: radial-gradient(circle at center, #071748 0%, #0d1117 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
                
        .brand-name {
            color: #ffffff;
            font-size: 1.5rem; 
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .author-name {
            color: #a3b8cc; 
            font-size: 1.1rem; 
            font-weight: 400;
            letter-spacing: -0.2px;
            margin-bottom: 16px;
        }

        .tagline {
            color: #9aa5b1;
            font-size: 0.9rem; 
            line-height: 1.6;
            margin-bottom: 28px;
            font-weight: 400;
        }

        .card {
            background: linear-gradient(135deg, rgba(22, 27, 34, 0.8) 0%, rgba(13, 17, 23, 0.9) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            border: 1px solid rgba(88, 166, 255, 0.15);
            padding: 45px 35px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4),
                        0 20px 50px rgba(0, 0, 0, 0.6),
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(163, 88, 255, 0.25), transparent);
            width: 100%;
            margin: 24px 0;
        }

        /* Upload Container Styling */
        .upload-area {
            border: 2px dashed rgba(88, 166, 255, 0.3);
            border-radius: 16px;
            padding: 28px 20px;
            background-color: rgba(21, 26, 33, 0.4);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 20px;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: #58a6ff;
            background-color: rgba(33, 38, 45, 0.7);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.15);
        }

        .upload-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
            display: block;
        }

        .upload-text {
            color: #cddee9;
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .upload-subtext {
            color: #6e7681;
            font-size: 0.8rem;
        }

        /* Hidden standard file input */
        #fileInput {
            display: none;
        }

        .btn-action {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 16px 22px;
            background: linear-gradient(135deg, #1f6feb 0%, #1158c7 100%);
            border: 1px solid rgba(88, 166, 255, 0.4);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: -0.2px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(31, 111, 235, 0.3);
        }

        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(31, 111, 235, 0.5);
            background: linear-gradient(135deg, #388bfd 0%, #1f6feb 100%);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Status & Terminal Log Output */
        .status-box {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            background-color: rgba(13, 17, 23, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.8);
            color: #8b949e;
            font-size: 0.85rem;
            text-align: left;
            min-height: 52px;
            display: flex;
            align-items: center;
            word-break: break-word;
            line-height: 1.4;
        }

        .status-box.active {
            color: #58a6ff;
            border-color: rgba(88, 166, 255, 0.3);
        }

        .status-box.success {
            color: #3fb950;
            border-color: rgba(63, 185, 80, 0.3);
        }

        .status-box.error {
            color: #f85149;
            border-color: rgba(248, 81, 73, 0.3);
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(88, 166, 255, 0.2);
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="brand-name">Upload Files</h1>
        <p class="tagline">Using our provided template, please drag the CSV file to submit your address batch.</p>
        
        <!-- File Drop Target -->
        <div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon">📄</span>
            <div class="upload-text" id="fileName">Choose file or drag & drop</div>
            <div class="upload-subtext">Supports .csv files up to 50MB</div>
            <input type="file" id="fileInput" accept=".csv" onchange="handleFileSelect(event)">
        </div>

        <button class="btn-action" id="uploadBtn" onclick="uploadFile()" disabled>
            <span id="btnText">Submit File</span>
            <span id="btnIcon">⚡</span>
        </button>

        <div class="divider"></div>

        <!-- Real-time Step Feedback -->
        <div class="status-box" id="statusBox">
            Ready to upload batch.
        </div>
    </div>

<script>
    // Configuration Endpoint
    const API_BASE_URL = "https://api.wirewavesolutions.io";

    let selectedFile = null;

    // Drag and drop handlers
    const dropArea = document.getElementById('dropArea');

    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropArea.classList.add('dragover');
        }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, (e) => {
            e.preventDefault();
            dropArea.classList.remove('dragover');
        }, false);
    });

    dropArea.addEventListener('drop', (e) => {
        const files = e.dataTransfer.files;
        if (files.length) {
            selectedFile = files[0];
            updateUIWithFile();
        }
    });

    function handleFileSelect(event) {
        if (event.target.files.length) {
            selectedFile = event.target.files[0];
            updateUIWithFile();
        }
    }

    function updateUIWithFile() {
        if (!selectedFile) return;
        
        // Ensure CSV extension
        if (!selectedFile.name.toLowerCase().endsWith('.csv')) {
            setStatus("Please select a valid .csv file.", "error");
            document.getElementById('uploadBtn').disabled = true;
            return;
        }

        document.getElementById('fileName').innerText = selectedFile.name;
        document.getElementById('uploadBtn').disabled = false;
        setStatus(`Selected: ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(1)} KB)`, '');
    }

    function setStatus(text, type, showSpinner = false) {
        const box = document.getElementById('statusBox');
        if (showSpinner) {
            box.innerHTML = `<div class="spinner"></div><span>${text}</span>`;
        } else {
            box.innerText = text;
        }
        box.className = `status-box ${type}`;
    }

    function setBtnLoading(isLoading) {
        const btn = document.getElementById('uploadBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        if (isLoading) {
            btn.disabled = true;
            btnText.innerText = "Uploading...";
            btnIcon.innerText = "⏳";
        } else {
            btn.disabled = !selectedFile;
            btnText.innerText = "Submit File";
            btnIcon.innerText = "⚡";
        }
    }

    async function uploadFile(fileInput) { const file = fileInput.files[0]; {
        if (!selectedFile) {
            setStatus("No file selected.", "error");
            return;
        }

        setBtnLoading(true);

        try {
            // 1. Determine Content-Type (Browsers often leave CSV file.type empty)
            const contentType = selectedFile.type || "text/csv";

            setStatus("Step 1/2: Requesting GCS upload authorization...", "active", true);

            // 2. Get GCS Signed URL from FastAPI Backend
            const urlEndpoint = `${API_BASE_URL}/generate-upload-url?filename=${encodeURIComponent(selectedFile.name)}&content_type=${encodeURIComponent(contentType)}`;
            
            const authResponse = await fetch(urlEndpoint, {
                method: "GET",
                headers: {
                    "Accept": "application/json"
                }
            });

            if (!authResponse.ok) {
                const errorText = await authResponse.text();
                throw new Error(`Backend auth failed (${authResponse.status}): ${errorText || authResponse.statusText}`);
            }

            const { upload_url } = await authResponse.json();

            if (!upload_url) {
                throw new Error("Backend response did not contain a valid upload_url.");
            }

            setStatus("Step 2/2: Uploading file directly to Google Cloud Storage...", "active", true);

            // 3. Perform Direct PUT Stream to GCS Signed URL
            const gcsResponse = await fetch(upload_url, {
                method: "PUT",
                headers: {
                    "Content-Type": contentType
                },
                body: selectedFile // Raw stream, no FormData wrapper
            });

            if (gcsResponse.ok) {
                setStatus(`Success! "${selectedFile.name}" was uploaded directly to GCS.`, "success");
                console.log("GCS direct upload complete.");
            } else {
                const gcsError = await gcsResponse.text();
                throw new Error(`GCS Direct Upload Failed (${gcsResponse.status}): ${gcsError || gcsResponse.statusText}`);
            }

        } catch (err) {
            console.error("Upload error:", err);
            setStatus(`Error: ${err.message}`, "error");
        } finally {
            setBtnLoading(false);
        }
    }
</script>
</body>
</html>
